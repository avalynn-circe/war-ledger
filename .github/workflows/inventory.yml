# Every two hours: collect from every source in sources.yaml, archive the
# source text, rebuild data/ and site/, commit both, and publish site/ to
# GitHub Pages. Telegram previews only show the last twenty posts of a
# channel, so a long gap between runs would lose posts on busy channels.
#
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
# The workflow token is not allowed to enable Pages itself.
# GitHub runs scheduled workflows from the default branch only.

name: The Ukraine War Ledger

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and render
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the extractor tests
        run: python -m pytest -q

      - name: Collect from every source and render the site
        run: python -m pipeline.run --data data --site site
        env:
          # Optional. With it, Cyrillic excerpts are translated once and cached
          # in data/translations.json; without it the originals are shown.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the day's data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "inventory: collection $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload site as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v5
